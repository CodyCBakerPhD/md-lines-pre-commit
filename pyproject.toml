[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-lines-pre-commit"
version = "0.1.0"
description = "pre-commit hook that puts each Markdown sentence on its own line"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["markdown-it-py>=3.0", "linkml-runtime>=1.9"]
keywords = ["markdown", "pre-commit", "semantic line breaks", "sentence per line"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# Regenerating src/md_lines/models.py from the LinkML schema, and the test that checks it.
dev = ["pytest>=7", "linkml>=1.9", "pre-commit"]

[project.scripts]
md-lines = "md_lines.cli:main"

[project.urls]
Repository = "https://github.com/CodyCBakerPhD/md-lines-pre-commit"

[tool.hatch.build.targets.wheel]
packages = ["src/md_lines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ai_generated: mark test as AI-generated",
]

[tool.black]
line-length = 100
target-version = ["py313"]
# Generated from src/md_lines/schema/md_lines.yaml; regenerate instead of editing.
extend-exclude = "src/md_lines/models\\.py"

[tool.ruff]
line-length = 100
target-version = "py313"
# Generated from src/md_lines/schema/md_lines.yaml; regenerate instead of editing.
extend-exclude = ["src/md_lines/models.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["md_lines"]

[tool.codespell]
skip = ".git,*.lock"
# Also flag British spellings: the project is written in American English.
builtin = "clear,rare,en-GB_to_en-US"
