name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          # Latest stable Python only; pyproject.toml sets the floor.
          python-version: "3.x"
      - run: pip install -e ".[dev]"
      - run: pytest --cov=src/md_lines --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

  # pre-commit.ci runs the other hooks on every pull request. It cannot run this repository's
  # own md-lines hook (`language: system`, skipped in .pre-commit-config.yaml), and it does not
  # test installing the hook the way a consumer does, so this job covers those two things.
  hook:
    name: md-lines hook and try-repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install -e ".[dev]"
      - name: This repository's own md-lines hook on its Markdown
        run: pre-commit run md-lines --all-files --show-diff-on-failure
      - name: Install the hook the way a consumer would
        run: pre-commit try-repo . md-lines --files README.md --verbose
