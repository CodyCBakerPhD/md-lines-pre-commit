name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          # Latest stable Python only; pyproject.toml sets the floor.
          python-version: "3.x"
      - run: pip install -e ".[dev]"
      - run: pytest --cov=src/md_lines --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

  # pre-commit.ci runs every hook, including this repository's own md-lines at its latest
  # release. This job installs the hook from the working tree instead, the way a consumer does.
  try-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install pre-commit
      - run: pre-commit try-repo . md-lines --files README.md --verbose
