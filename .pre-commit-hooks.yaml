- id: md-lines
  name: md-lines (one sentence per line in Markdown)
  description: >-
    Reflow Markdown prose so that each sentence sits on its own line. Code, tables,
    headings, HTML and front matter are left alone. Files that needed changes are
    rewritten and the hook fails once so the changes can be reviewed and staged.
  entry: md-lines
  language: python
  types: [markdown]
  minimum_pre_commit_version: "2.9.0"
